name: Merge Jild 19 tashreeh
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge chunks
        run: python3 merge_jild19.py
      - name: Verify merged file
        run: |
          python3 - <<'EOF'
          import json
          d = json.load(open('jild-19.json', encoding='utf-8'))
          items = d['masail']
          pages = set()
          for it in items:
              pages.update(it['pages'])
          print('items:', len(items))
          print('unique pages:', len(pages), 'min:', min(pages), 'max:', max(pages))
          print('ids unique:', len(set(it['id'] for it in items)) == len(items))
          print('empty jawab:', sum(1 for it in items if not it.get('tashreeh_jawab')))
          print('empty sawal:', [it['id'] for it in items if not it.get('tashreeh_sawal')])
          print('volume_ids:', sorted(set(it.get('volume_id') for it in items)))
          print('start_page==min(pages) all:', all(it.get('start_page') == min(it['pages']) for it in items))
          print('sorted by start_page:', [it['start_page'] for it in items] == sorted(it['start_page'] for it in items))
          combined = {
              'jild19-masala-24': ([138, 139, 140, 141], 1398, 3449),
              'jild19-masala-48': (list(range(185, 194)), 3337, 7015),
              'jild19-masala-91': ([292, 293], 805, 1053),
              'jild19-masala-113': ([342, 343], 870, 1335),
              'jild19-masala-140': ([391, 392, 393], 869, 2736),
              'jild19-masala-153': (list(range(440, 445)), 487, 3786),
              'jild19-masala-172': ([489, 490, 491, 492], 776, 1948),
              'jild19-masala-228': (list(range(563, 608)), 1041, 52964),
          }
          for cid, (expected_pages, exp_sawal, exp_jawab) in combined.items():
              hits = [it for it in items if it['id'] == cid]
              print(cid, 'items:', len(hits), 'pages:', hits[0]['pages'][0], '-', hits[0]['pages'][-1], f'({len(hits[0]["pages"])} pages)' if hits else None)
              assert len(hits) == 1
              assert hits[0]['pages'] == expected_pages, f'{cid}: pages mismatch'
              assert len(hits[0].get('tashreeh_sawal', '')) == exp_sawal, f'{cid}: sawal length mismatch'
              assert len(hits[0].get('tashreeh_jawab', '')) == exp_jawab, f'{cid}: jawab length mismatch'
              assert hits[0].get('tashreeh_sawal'), f'{cid}: sawal empty'
              assert hits[0].get('tashreeh_jawab'), f'{cid}: jawab empty'
          # masala-91 title fix: "(حصہ اول)" suffix must be gone
          m91 = [it for it in items if it['id'] == 'jild19-masala-91'][0]
          assert not m91['title'].endswith('(حصہ اول)'), 'masala-91 title still carries (حصہ اول)'
          print('masala-91 title:', m91['title'])
          # rename: masala-150 exists once, masala-250 gone
          m150 = [it for it in items if it['id'] == 'jild19-masala-150']
          assert len(m150) == 1, 'masala-150 expected exactly once'
          assert m150[0]['pages'] == [433, 434, 435, 436, 437], 'masala-150 pages mismatch'
          assert not any(it['id'] == 'jild19-masala-250' for it in items), 'masala-250 must be gone'
          print('masala-250 -> masala-150 renamed')
          # absorbed id must be gone
          assert not any(it['id'] == 'jild19-muna-wal-durar-2' for it in items), 'muna-wal-durar-2 should have been combined away'
          print('1 absorbed id gone')
          # distinct items kept separate
          for did, exp_pages in [
                  ('jild19-masala-57', [210, 211, 212]),
                  ('jild19-p212', [212, 213, 214]),
                  ('jild19-masala-193', [501]),
                  ('jild19-p504', [504]),
                  ('jild19-masala-220', [539, 540]),
                  ('jild19-p541', list(range(541, 551))),
                  ('jild19-pesh-lafz', [5, 6, 7]),
                  ('jild19-khatima', [692])]:
              hits = [it for it in items if it['id'] == did]
              assert len(hits) == 1, f'{did}: expected exactly 1 item'
              assert hits[0]['pages'] == exp_pages, f'{did}: pages mismatch'
              print(did, 'present (kept separate)')
          assert len(items) == 261
          assert len(pages) == 599
          assert min(pages) == 5 and max(pages) == 692
          assert len(set(it['id'] for it in items)) == len(items)
          assert all(it.get('tashreeh_jawab') for it in items)
          assert {it['id'] for it in items if not it.get('tashreeh_sawal')} == {
              'jild19-pesh-lafz', 'jild19-masala-70', 'jild19-masala-74',
              'jild19-masala-237', 'jild19-khatima'}
          print('VERIFICATION PASSED')
          EOF
      - name: Create release with merged file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la jild-19.json
          gh release create v1.0 jild-19.json --title "Jild 19 tashreeh - merged" --notes "Merged tashreeh for Fatawa Razviya Jild 19: 261 items, 599 pages (volume_id 45, pp. 5-692, 89 source-DB gap pages). Generated by merge_jild19.py from the 16 chunk files; 8 combine cases (masala-24, -48, -91, -113, -140, -153, -172, -228 cross-id) + rename masala-250 -> masala-150 (p. 433 print error)." || gh release upload v1.0 jild-19.json --clobber
